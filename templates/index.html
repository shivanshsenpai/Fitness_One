<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-Time Yoga Assistant | Fit Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6c13d4b345.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-primary: #080c14;
            --bg-secondary: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.7);
            --border-glow: rgba(0, 240, 255, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-purple: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .pose-navbar {
            height: 70px;
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 800;
            font-size: 1.3rem;
        }

        .btn-back {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            color: var(--accent-cyan);
            transform: translateX(-3px);
        }

        /* Main Studio Workspace */
        .studio-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2rem;
            align-items: start;
        }

        .viewport-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
            backdrop-filter: var(--glass-blur);
            position: relative;
            overflow: hidden;
        }

        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .camera-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sidebar Guide */
        .guide-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: var(--glass-blur);
        }

        .guide-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            color: var(--accent-cyan);
        }

        .pose-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .pose-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .pose-item:hover {
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .pose-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .pose-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }

        @media (max-width: 900px) {
            .studio-container {
                grid-template-columns: 1fr;
            }
            .video-wrapper {
                height: 340px;
            }
        }
    </style>
</head>
<body>
    <header class="pose-navbar">
        <a href="/" class="nav-logo">
            <span>Fit Connect</span>
        </a>
        <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Exit Studio</a>
    </header>

    <div class="studio-container">
        <main class="viewport-card">
            <div class="camera-header">
                <h2>MediaPipe AI Camera Feed</h2>
                <div class="live-badge">
                    <span class="live-dot"></span> LIVE DETECTOR
                </div>
            </div>
            <div class="video-wrapper">
                <img id="videoElement" src="{{ url_for('video_feed') }}" alt="Pose Detection Video Stream">
            </div>
        </main>

        <aside class="guide-card">
            <h3>Supported Yoga Poses</h3>
            <ul class="pose-list">
                <li class="pose-item">
                    <span class="pose-name"><i class="fa-solid fa-person-walking"></i> Warrior Pose</span>
                    <span class="pose-tag">Virabhadrasana</span>
                </li>
                <li class="pose-item">
                    <span class="pose-name"><i class="fa-solid fa-tree"></i> Tree Pose</span>
                    <span class="pose-tag">Vrikshasana</span>
                </li>
                <li class="pose-item">
                    <span class="pose-name"><i class="fa-solid fa-staff-snake"></i> Cobra Pose</span>
                    <span class="pose-tag">Bhujangasana</span>
                </li>
                <li class="pose-item">
                    <span class="pose-name"><i class="fa-solid fa-dog"></i> Downward Dog</span>
                    <span class="pose-tag">Adho Mukha</span>
                </li>
                <li class="pose-item">
                    <span class="pose-name"><i class="fa-solid fa-child-reaching"></i> T-Pose</span>
                    <span class="pose-tag">Calibration</span>
                </li>
            </ul>
        </aside>
    </div>
</body>
</html>
